name: backend

on:
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create test database
        run: psql "postgres://postgres:postgres@localhost:54329/postgres" -c "create database pixel_magic_test"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run the compiled migrations on a fresh database
        env:
          DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:54329/pixel_magic_ci
        run: |
          psql "postgres://postgres:postgres@localhost:54329/postgres" -c "create database pixel_magic_ci"
          node dist/db/migrate.js
