services:
  db:
    image: postgres:${POSTGRES_VERSION:-17}
    ports:
      - "54329:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pixel_magic
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      retries: 15

  api:
    build: .
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      MODE: api
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/pixel_magic
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@db:5432/pixel_magic
      SUPABASE_URL: https://example.supabase.co
      PADDLE_API_KEY: dummy-paddle-api-key
      PADDLE_WEBHOOK_SECRET: dummy-paddle-webhook-secret

  worker:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      MODE: worker
      PORT: "8081"
